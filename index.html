<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Belajar Bersama Aqil!</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;overflow-x:hidden;color:#fff;background:radial-gradient(circle at 15% 20%,rgba(70,130,255,.18),transparent 28%),radial-gradient(circle at 85% 75%,rgba(105,75,255,.17),transparent 30%),linear-gradient(145deg,#06142e,#0b1740 55%,#030a1c);font-family:Arial,Helvetica,sans-serif}
.stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(white 1px,transparent 1.5px),radial-gradient(#9cc8ff 1px,transparent 1.5px),radial-gradient(#ffe98a 1px,transparent 1.5px);background-size:73px 73px,113px 113px,157px 157px;background-position:0 0,30px 45px,80px 20px;animation:twinkle 3s ease-in-out infinite alternate;opacity:.5}
.stars:before{animation-delay:.8s;transform:translateY(13px);opacity:.3}.stars:after{animation-delay:1.5s;transform:translateY(-10px);opacity:.35}
.page{position:relative;z-index:1;width:min(100%,1000px);text-align:center}
h1{color:#ffe77a;font-size:clamp(1.45rem,4vw,2.4rem);margin:0 0 10px;text-shadow:0 0 16px #477dff}
.subtitle{color:#dbe8ff;margin:0 0 25px;font-size:clamp(.95rem,2vw,1.1rem)}
.tv{background:linear-gradient(145deg,#505c70,#171d2a 45%,#30394b);padding:clamp(10px,2.5vw,22px);border:4px solid #8794a9;border-radius:28px;box-shadow:0 0 28px rgba(79,140,255,.55),0 18px 45px rgba(0,0,0,.45),inset 0 0 8px #080b12}
.screen{background:#000;padding:5px;border-radius:13px;line-height:0}
iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:9px}
.tv-controls{display:flex;justify-content:center;align-items:center;gap:9px;height:18px;padding-top:9px}
.light{width:8px;height:8px;border-radius:50%;background:#56d6ff;box-shadow:0 0 9px #56d6ff}
.speaker{width:48px;height:4px;border-radius:5px;background:#8b96a8}
.caption{color:#fff;margin:22px 0 0;font-weight:700;font-size:clamp(1rem,2.5vw,1.25rem)}
.caption span{color:#ffe77a}.note{color:#b9c9e8;font-size:.85rem;margin-top:14px}
@keyframes twinkle{from{opacity:.22}to{opacity:.72}}
@media(prefers-reduced-motion:reduce){.stars,.stars:before,.stars:after{animation:none}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="page">
<h1>Jom Belajar Bersama Aqil!</h1>
<p class="subtitle">Video pembelajaran: Jaga Adab Tidurmu 🌙</p>
<section class="tv" aria-label="Pemain video dalam bingkai televisyen">
<div class="screen">
<iframe src="https://www.youtube.com/embed/gEvuIOoo-m4" title="Video Pembelajaran Jaga Adab Tidurmu" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
<div class="tv-controls" aria-hidden="true"><span class="light"></span><span class="speaker"></span></div>
</section>
<p class="caption">✦ <span>Jom belajar dan amalkan sunnah Rasulullah SAW!</span> ✦</p>
<p class="note">Jika video tidak dimainkan, buka video terus di YouTube dan pastikan tetapan embed dibenarkan.</p>
</main>
</body>
</html>
